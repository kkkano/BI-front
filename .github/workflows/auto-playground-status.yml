name: Auto Update Playground Status

on:
  push:
    branches:
      - feat/agentic-playground

permissions:
  contents: write

jobs:
  update-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update status board
        run: python scripts/update_playground_status.py

      - name: Commit status board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAYGROUND_STATUS.md
          if git diff --cached --quiet; then
            echo "No status changes"
            exit 0
          fi
          git commit -m "chore(status): auto refresh playground board [skip ci]"
          git push
