name: CI

on:
  push:
    branches:
      - main
      - feat/agentic-playground
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npm run lint:js
          npm run tsc

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --ci --watchAll=false
